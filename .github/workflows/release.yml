name: Publish release artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build distribution ZIP
        run: npm run build:artifact

      - name: Prepare version release notes
        run: |
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          version = os.environ['TAG'].removeprefix('v')
          lines = Path('NOTES.MD').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '## ' + version or line.startswith('## ' + version + ' - ')) + 1
          end = next((i for i in range(start, len(lines)) if lines[i].startswith('## ')), len(lines))
          Path('dist/release-notes.md').write_text('\n'.join(lines[start:end]).strip() + '\n')
          PYNOTES

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".zip"))' \
              | while IFS= read -r asset; do
                  gh release delete-asset "$TAG" "$asset" --yes
                done
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" dist/*.zip --title "OCCS CLI $TAG" --notes-file dist/release-notes.md
          fi
